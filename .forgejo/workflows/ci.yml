name: CI

on:
  push:
    branches:
      - '**'
  release:
    types: [created]
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nosial/ncc:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build project
        run: |
          ncc project install --log-level debug -y
          ncc build --config debug --log-level debug

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: debug
          path: target/debug/net.nosial.federation_jevguard.ncc

  release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nosial/ncc:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build project
        run: |
          ncc project install --log-level debug -y
          ncc build --config release --log-level debug

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: target/release/net.nosial.federation_jevguard.ncc

  # Check for phpunit.xml
  check-phpunit:
    runs-on: ubuntu-latest
    outputs:
      phpunit-exists: ${{ steps.check.outputs.phpunit-exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check for phpunit.xml
        id: check
        run: |
          if [ -f phpunit.xml ]; then
            echo "phpunit-exists=true" >> $GITHUB_OUTPUT
          else
            echo "phpunit-exists=false" >> $GITHUB_OUTPUT
          fi

  # Check for phpdoc.dist.xml
  check-phpdoc:
    runs-on: ubuntu-latest
    outputs:
      phpdoc-exists: ${{ steps.check.outputs.phpdoc-exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check for phpdoc.dist.xml
        id: check
        run: |
          if [ -f phpdoc.dist.xml ]; then
            echo "phpdoc-exists=true" >> $GITHUB_OUTPUT
          else
            echo "phpdoc-exists=false" >> $GITHUB_OUTPUT
          fi

  generate-phpdoc:
    needs: [release, check-phpdoc]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nosial/ncc:latest
    if: needs.check-phpdoc.outputs.phpdoc-exists == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download PHPDocumentor
        run: |
          wget https://phpdoc.org/phpDocumentor.phar
          chmod +x phpDocumentor.phar

      - name: Generate PHPDoc
        run: |
          php phpDocumentor.phar -d src -t docs

      - name: Archive PHPDoc
        run: |
          zip -r docs.zip docs

      - name: Upload PHPDoc
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs.zip


  test:
    needs: [debug, release, check-phpunit]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nosial/federationlib:latest
    if: needs.check-phpunit.outputs.phpunit-exists == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install ncc packages
        run: |
          ncc project install --log-level debug -y
          ncc build --config=release --log-level debug

      - name: Download PHPUnit
        # The same major version as the local runs, the tests use its attributes
        run: wget -O phpunit.phar https://phar.phpunit.de/phpunit-13.phar

      # The integration tests need the docker test environment (make test-env) and the live tests a System One
      # endpoint, both run outside of CI
      - name: Run PHPUnit tests
        run: |
          mkdir -p "$PWD/reports"
          chmod 777 "$PWD/reports"
          php phpunit.phar --configuration phpunit.xml --exclude-group integration --exclude-group live --log-junit "$PWD/reports/junit.xml" --log-teamcity "$PWD/reports/teamcity" --testdox-html "$PWD/reports/testdox.html" --testdox-text "$PWD/reports/testdox.txt"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: reports



  # The live tests send the plugin's real questions to TypeSafe's API with the JEVGUARD_LIVE_API_KEY secret. Every run
  # spends tokens, so they only run on demand (Run workflow) and on releases, never on every push
  live-test:
    needs: [release]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nosial/federationlib:latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    concurrency:
      group: live-test
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install ncc packages
        run: |
          ncc project install --log-level debug -y
          ncc build --config=release --log-level debug

      - name: Download PHPUnit
        run: wget -O phpunit.phar https://phar.phpunit.de/phpunit-13.phar

      - name: Run live tests
        env:
          JEVGUARD_LIVE_ENDPOINT: https://api.typesafe.ai/v1/systemone
          JEVGUARD_LIVE_API_KEY: ${{ secrets.JEVGUARD_LIVE_API_KEY }}
          JEVGUARD_LIVE_MODEL: ${{ vars.JEVGUARD_LIVE_MODEL || 'jev-latest' }}
        run: |
          if [ -z "$JEVGUARD_LIVE_API_KEY" ]; then
            echo "::error::The JEVGUARD_LIVE_API_KEY secret is not set, the live tests would only be skipped"
            exit 1
          fi
          php phpunit.phar --configuration phpunit.xml --group live

  release-documentation:
    needs: generate-phpdoc
    permissions: write-all
    runs-on: ubuntu-latest
    container:
      image: php:8.5
    if: github.event_name == 'release'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download documentation artifact
        uses: actions/download-artifact@v8
        with:
          name: documentation
          path: documentation

      - name: Upload documentation artifact
        uses: softprops/action-gh-release@v3
        with:
            files: |
                documentation/*
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  release-artifacts:
    needs: [debug, release]
    permissions: write-all
    runs-on: ubuntu-latest
    container:
      image: php:8.5
    if: github.event_name == 'release'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download debug artifact
        uses: actions/download-artifact@v8
        with:
          name: debug
          path: debug

      - name: Upload debug artifact to release
        uses: softprops/action-gh-release@v3
        with:
            files: |
                debug/*
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Upload release artifact to release
        uses: softprops/action-gh-release@v3
        with:
            files: |
                release/*
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


