source: src
default_build: release
update_source: nosial/federationjevguard@n64
repository:
  name: n64
  type: github
  host: git.n64.cc
  ssl: true
assembly:
  name: FederationJevGuard
  package: net.nosial.federation_jevguard
  version: 1.0.1
  url: 'https://github.com/nosial/FederationJevGuard'
  license: 'MIT'
  description: 'FederationJevGuard is a FederationLib plugin that reviews reports, evidence and entities with a System One model such as TypeSafe Jev'
  author: 'Netkas <netkas@nosial.net>'
  organization: 'Nosial'
  product: 'Federation'
  copyright: 'Copyright (c) 2022-2026 Nosial'
dependencies:
  net.nosial.federation: nosial/federationlib@github
build_configurations:
  -
    name: debug
    output: 'target/debug/${ASSEMBLY.PACKAGE}.ncc'
    type: ncc
    definitions:
      NCC_DEBUG: true
    options:
      federationlib: &federationlib
        # Scanned content is classified but never stored by the plugin, the reviews only read records the server
        # already keeps
        collects_scan_content: false
        event_handlers:
          # Creates the plugin's tables and operator
          -
            event: STARTUP
            class: \FederationJevGuard\Handlers\StartupHandler::class
          # Queues the records not reviewed yet and reviews the queue
          -
            event: MAINTENANCE
            class: \FederationJevGuard\Handlers\MaintenanceHandler::class
          # Classifies the messages of authenticated content scans
          -
            event: CONTENT_SCAN
            class: \FederationJevGuard\Handlers\ContentScanHandler::class
          # Adds the plugin's latest decision about a queried entity to the response
          -
            event: QUERY_ENTITY
            class: \FederationJevGuard\Handlers\QueryEntityHandler::class
          # Queues new reports, evidence and attachments, and follows whitelists, lifts and deletions
          -
            event: RECORD_CHANGE
            class: \FederationJevGuard\Handlers\RecordChangeHandler::class
            filter: REPORT_CREATED, REPORT_CLOSED, EVIDENCE_CREATED, ATTACHMENT_CREATED, ENTITY_UPDATED, ENTITY_DELETED, BLACKLIST_LIFTED, BLACKLIST_DELETED
  -
    name: release
    output: 'target/release/${ASSEMBLY.PACKAGE}.ncc'
    type: ncc
    options:
      federationlib: *federationlib
